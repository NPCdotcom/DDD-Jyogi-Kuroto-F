name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  # --------------------------------------------------------------
  # Branch Name Check (PR only)
  # --------------------------------------------------------------
  check-branch-name:
    name: Branch Name Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PR branch: $HEAD_REF"
          if [[ "$HEAD_REF" =~ ^(feat|fix|docs|chore)/#[0-9]+$ ]] || [[ "$HEAD_REF" == "develop" ]]; then
            echo "OK: branch name matches the rule"
            exit 0
          else
            echo "::error::Branch name '$HEAD_REF' does not match the rule."
            echo "::error::Expected: feat/#<issue>, fix/#<issue>, docs/#<issue>, chore/#<issue>, or develop"
            echo "::error::See docs/BranchingStrategy.md for details"
            exit 1
          fi

